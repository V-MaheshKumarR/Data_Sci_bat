<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transformer Attention Class Demo</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #5d6774;
      --line: #d7dde5;
      --paper: #f8fafc;
      --panel: #ffffff;
      --blue: #2563eb;
      --teal: #0f766e;
      --rose: #be123c;
      --amber: #b45309;
      --green: #15803d;
      --shadow: 0 12px 32px rgba(20, 35, 55, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f8fafc 0%, #eef4f8 100%);
    }

    button, input {
      font: inherit;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .topbar {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .model-badge {
      padding: 7px 10px;
      border: 1px solid #b8c7dc;
      color: #274363;
      background: #edf4fb;
      border-radius: 7px;
      font-size: 13px;
      white-space: nowrap;
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 22px 20px 34px;
      display: grid;
      gap: 18px;
    }

    .control-band {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 12px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 8px;
      padding: 14px;
    }

    .sentence-input {
      width: 100%;
      min-height: 44px;
      border: 1px solid #b8c7dc;
      border-radius: 7px;
      padding: 10px 12px;
      color: var(--ink);
      background: #fff;
    }

    .sentence-input:focus {
      outline: 3px solid rgba(37, 99, 235, 0.18);
      border-color: var(--blue);
    }

    .step-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .step-button {
      min-height: 38px;
      border: 1px solid #bac7d5;
      color: #243447;
      background: #fff;
      border-radius: 7px;
      padding: 8px 11px;
      cursor: pointer;
      transition: 120ms ease;
    }

    .step-button:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .step-button.active {
      color: #fff;
      background: var(--blue);
      border-color: var(--blue);
    }

    .workspace {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 18px;
      align-items: start;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 15px;
      border-bottom: 1px solid var(--line);
      background: #fbfdff;
    }

    .section-title h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .section-title span {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .section-body {
      padding: 15px;
    }

    .token-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 44px;
      align-items: center;
    }

    .token-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      min-width: 54px;
      padding: 7px 10px;
      border: 1px solid #aebbd0;
      border-radius: 7px;
      background: #f7fbff;
      font-weight: 650;
      color: #1f3655;
    }

    .token-chip.negation {
      color: #831843;
      background: #fff1f5;
      border-color: #f9a8c2;
    }

    .token-chip.sentiment {
      color: #075985;
      background: #eef8ff;
      border-color: #93c5fd;
    }

    .token-chip.object {
      color: #14532d;
      background: #effaf2;
      border-color: #86efac;
    }

    .vector-table, .attention-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .vector-table th, .vector-table td,
    .attention-table th, .attention-table td {
      border: 1px solid var(--line);
      padding: 7px;
      text-align: center;
    }

    .vector-table th, .attention-table th {
      background: #f3f7fb;
      color: #38485a;
      font-weight: 700;
    }

    .matrix-scroll {
      overflow: auto;
      max-width: 100%;
      border-radius: 7px;
    }

    .attention-cell {
      color: #0f172a;
      font-weight: 700;
      min-width: 52px;
    }

    .flow-line {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .flow-step {
      border: 1px solid #cbd5e1;
      background: #f8fbfd;
      border-radius: 7px;
      padding: 10px;
      min-height: 76px;
    }

    .flow-step strong {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #2a3a4c;
    }

    .flow-step p {
      margin: 0;
      font-size: 13px;
      line-height: 1.35;
      color: var(--muted);
    }

    .head-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .head-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfdff;
    }

    .head-card h3 {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.25;
    }

    .head-card .focus-token {
      margin-top: 8px;
      font-weight: 700;
      color: var(--blue);
    }

    .prediction-wrap {
      display: grid;
      gap: 12px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 86px 1fr 54px;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .bar-track {
      height: 16px;
      border-radius: 999px;
      background: #e8eef5;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      transition: width 220ms ease;
    }

    .bar-fill.positive {
      background: var(--green);
    }

    .bar-fill.negative {
      background: var(--rose);
    }

    .callout {
      border-left: 4px solid var(--teal);
      background: #effafa;
      padding: 11px 12px;
      border-radius: 0 7px 7px 0;
      color: #194542;
      line-height: 1.45;
      font-size: 14px;
    }

    .formula {
      font-family: Consolas, Monaco, monospace;
      background: #111827;
      color: #e5f0ff;
      padding: 11px 12px;
      border-radius: 7px;
      overflow-x: auto;
      font-size: 13px;
    }

    .empty-state {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    @media (max-width: 920px) {
      .workspace, .control-band {
        grid-template-columns: 1fr;
      }

      .step-buttons {
        justify-content: flex-start;
      }

      .flow-line, .head-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        padding-inline: 12px;
      }

      .bar-row {
        grid-template-columns: 72px 1fr 46px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="topbar">
        <h1>Transformer Attention Class Demo</h1>
        <div class="model-badge">Toy encoder classifier</div>
      </div>
    </header>

    <main>
      <section class="control-band" aria-label="Demo controls">
        <input id="sentenceInput" class="sentence-input" value="the movie was not good" aria-label="Sentence" />
        <div class="step-buttons" id="stepButtons"></div>
      </section>

      <section class="section">
        <div class="section-title">
          <h2>Transformer Pipeline</h2>
          <span id="currentStepLabel">Tokenization</span>
        </div>
        <div class="section-body">
          <div class="flow-line" id="flowLine"></div>
        </div>
      </section>

      <div class="workspace">
        <div class="section">
          <div class="section-title">
            <h2 id="leftTitle">Tokens</h2>
            <span id="leftMeta">text to pieces</span>
          </div>
          <div class="section-body" id="leftPanel"></div>
        </div>

        <div class="section">
          <div class="section-title">
            <h2 id="rightTitle">Class Notes</h2>
            <span id="rightMeta">board explanation</span>
          </div>
          <div class="section-body" id="rightPanel"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const steps = [
      { id: "tokens", label: "Tokens" },
      { id: "vectors", label: "Vectors" },
      { id: "attention", label: "Attention" },
      { id: "heads", label: "Heads" },
      { id: "prediction", label: "Prediction" }
    ];

    let activeStep = "tokens";

    const lexicon = {
      good: { kind: "sentiment", vector: [0.90, 0.05, 0.00, 0.10, 0.15, 0.05] },
      great: { kind: "sentiment", vector: [0.98, 0.03, 0.00, 0.08, 0.18, 0.05] },
      excellent: { kind: "sentiment", vector: [1.00, 0.02, 0.00, 0.08, 0.18, 0.05] },
      amazing: { kind: "sentiment", vector: [0.96, 0.02, 0.00, 0.08, 0.18, 0.05] },
      bad: { kind: "sentiment", vector: [0.04, 0.95, 0.00, 0.10, 0.10, 0.05] },
      boring: { kind: "sentiment", vector: [0.03, 0.90, 0.00, 0.08, 0.10, 0.05] },
      poor: { kind: "sentiment", vector: [0.04, 0.92, 0.00, 0.08, 0.10, 0.05] },
      terrible: { kind: "sentiment", vector: [0.02, 0.98, 0.00, 0.08, 0.10, 0.05] },
      not: { kind: "negation", vector: [0.00, 0.00, 1.00, 0.10, 0.05, 0.10] },
      no: { kind: "negation", vector: [0.00, 0.00, 0.96, 0.10, 0.05, 0.10] },
      never: { kind: "negation", vector: [0.00, 0.00, 0.98, 0.10, 0.05, 0.10] },
      movie: { kind: "object", vector: [0.05, 0.05, 0.00, 0.92, 0.08, 0.05] },
      product: { kind: "object", vector: [0.05, 0.05, 0.00, 0.90, 0.08, 0.05] },
      phone: { kind: "object", vector: [0.05, 0.05, 0.00, 0.88, 0.08, 0.05] },
      class: { kind: "object", vector: [0.05, 0.05, 0.00, 0.84, 0.08, 0.05] },
      love: { kind: "sentiment", vector: [0.88, 0.03, 0.00, 0.06, 0.70, 0.05] },
      like: { kind: "sentiment", vector: [0.76, 0.04, 0.00, 0.06, 0.56, 0.05] },
      hate: { kind: "sentiment", vector: [0.03, 0.88, 0.00, 0.06, 0.62, 0.05] },
      transformers: { kind: "object", vector: [0.16, 0.02, 0.00, 0.58, 0.20, 0.85] },
      attention: { kind: "object", vector: [0.15, 0.02, 0.00, 0.50, 0.18, 0.80] }
    };

    const dims = ["positive", "negative", "negation", "object", "action", "tech"];

    function tokenize(text) {
      return text
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .split(/\s+/)
        .filter(Boolean);
    }

    function fallbackVector(token) {
      let seed = 0;
      for (const char of token) seed += char.charCodeAt(0);
      return [
        ((seed % 17) / 100) + 0.05,
        ((seed % 13) / 100) + 0.05,
        0.00,
        ((seed % 19) / 100) + 0.10,
        ((seed % 11) / 100) + 0.06,
        ((seed % 23) / 100) + 0.05
      ];
    }

    function baseVector(token) {
      return lexicon[token]?.vector ?? fallbackVector(token);
    }

    function tokenKind(token) {
      return lexicon[token]?.kind ?? "neutral";
    }

    function positionVector(index) {
      return [
        Math.sin(index + 1) * 0.08,
        Math.cos(index + 1) * 0.08,
        Math.sin((index + 1) / 2) * 0.05,
        Math.cos((index + 1) / 2) * 0.05,
        Math.sin((index + 1) / 3) * 0.04,
        Math.cos((index + 1) / 3) * 0.04
      ];
    }

    function finalVector(token, index) {
      const base = baseVector(token);
      const pos = positionVector(index);
      return base.map((value, i) => value + pos[i]);
    }

    function softmax(values) {
      const max = Math.max(...values);
      const exps = values.map(value => Math.exp(value - max));
      const sum = exps.reduce((total, value) => total + value, 0);
      return exps.map(value => value / sum);
    }

    function attentionScores(tokens, headName) {
      const vectors = tokens.map(finalVector);
      return tokens.map((queryToken, i) => {
        const rawScores = tokens.map((keyToken, j) => {
          const distance = Math.abs(i - j);
          const query = vectors[i];
          const key = vectors[j];
          let score = query.reduce((sum, value, dim) => sum + value * key[dim], 0) / Math.sqrt(dims.length);

          if (headName === "sentiment") {
            if (tokenKind(queryToken) === "sentiment" && tokenKind(keyToken) === "negation" && j < i) score += 2.4 / (distance || 1);
            if (tokenKind(keyToken) === "sentiment") score += 0.7;
          }

          if (headName === "local") {
            score += Math.max(0, 1.4 - distance * 0.45);
          }

          if (headName === "object") {
            if (tokenKind(keyToken) === "object") score += 1.1;
            if (tokenKind(queryToken) === "sentiment" && tokenKind(keyToken) === "object") score += 0.7 / (distance || 1);
          }

          return score;
        });
        return softmax(rawScores);
      });
    }

    function averageAttention(tokens) {
      const heads = ["sentiment", "local", "object"].map(name => attentionScores(tokens, name));
      return tokens.map((_, row) => tokens.map((__, col) => {
        const sum = heads.reduce((total, matrix) => total + matrix[row][col], 0);
        return sum / heads.length;
      }));
    }

    function sentimentPrediction(tokens) {
      let positive = 0.24;
      let negative = 0.24;

      tokens.forEach((token, index) => {
        const vector = baseVector(token);
        const hasNegationBefore = tokens.slice(Math.max(0, index - 3), index).some(prev => tokenKind(prev) === "negation");
        let pos = vector[0];
        let neg = vector[1];
        if (hasNegationBefore && tokenKind(token) === "sentiment") {
          const oldPos = pos;
          pos = neg + 0.12;
          neg = oldPos + 0.56;
        }
        positive += pos;
        negative += neg;
      });

      const total = positive + negative;
      return {
        positive: positive / total,
        negative: negative / total
      };
    }

    function htmlEscape(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderButtons() {
      const container = document.getElementById("stepButtons");
      container.innerHTML = steps.map(step => `
        <button class="step-button ${step.id === activeStep ? "active" : ""}" data-step="${step.id}">${step.label}</button>
      `).join("");

      container.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          activeStep = button.dataset.step;
          render();
        });
      });
    }

    function renderFlow() {
      const flow = [
        ["Tokens", "split text into model pieces"],
        ["Vectors", "word meaning plus position"],
        ["Attention", "tokens exchange context"],
        ["Heads", "multiple relationship views"],
        ["Prediction", "output layer chooses a class"]
      ];
      document.getElementById("flowLine").innerHTML = flow.map((item, index) => {
        const isActive = steps[index].id === activeStep;
        return `
          <div class="flow-step" style="border-color:${isActive ? "#2563eb" : "#cbd5e1"}; background:${isActive ? "#eef5ff" : "#f8fbfd"}">
            <strong>${item[0]}</strong>
            <p>${item[1]}</p>
          </div>
        `;
      }).join("");
    }

    function renderTokenChips(tokens) {
      if (!tokens.length) return '<div class="empty-state">Enter a sentence to create tokens.</div>';
      return `<div class="token-row">${tokens.map(token => {
        const kind = tokenKind(token);
        return `<span class="token-chip ${kind}">${htmlEscape(token)}</span>`;
      }).join("")}</div>`;
    }

    function renderVectorTable(tokens) {
      if (!tokens.length) return '<div class="empty-state">No vectors available.</div>';
      const rows = tokens.map((token, index) => {
        const vector = finalVector(token, index);
        return `
          <tr>
            <th>${htmlEscape(token)}</th>
            ${vector.map(value => `<td>${value.toFixed(2)}</td>`).join("")}
          </tr>
        `;
      }).join("");
      return `
        <div class="matrix-scroll">
          <table class="vector-table">
            <thead>
              <tr><th>token</th>${dims.map(dim => `<th>${dim}</th>`).join("")}</tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderAttentionTable(tokens, matrix) {
      if (!tokens.length) return '<div class="empty-state">No attention matrix available.</div>';
      const header = `<tr><th>query/key</th>${tokens.map(token => `<th>${htmlEscape(token)}</th>`).join("")}</tr>`;
      const rows = matrix.map((row, rowIndex) => `
        <tr>
          <th>${htmlEscape(tokens[rowIndex])}</th>
          ${row.map(value => {
            const alpha = Math.min(0.95, Math.max(0.10, value));
            return `<td class="attention-cell" style="background: rgba(37, 99, 235, ${alpha})">${value.toFixed(2)}</td>`;
          }).join("")}
        </tr>
      `).join("");
      return `
        <div class="matrix-scroll">
          <table class="attention-table">
            <thead>${header}</thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderHeads(tokens) {
      if (!tokens.length) return '<div class="empty-state">No head outputs available.</div>';
      const headData = [
        ["sentiment", "Negation and emotion"],
        ["local", "Nearby word order"],
        ["object", "Topic or target word"]
      ];

      return `<div class="head-grid">${headData.map(([name, label]) => {
        const matrix = attentionScores(tokens, name);
        const lastIndex = Math.max(0, tokens.findIndex(token => tokenKind(token) === "sentiment"));
        const focusRow = matrix[lastIndex] ?? matrix[0];
        const focusIndex = focusRow.indexOf(Math.max(...focusRow));
        return `
          <div class="head-card">
            <h3>${label}</h3>
            <div class="matrix-scroll">${renderAttentionTable(tokens, matrix)}</div>
            <div class="focus-token">strongest focus: ${htmlEscape(tokens[focusIndex])}</div>
          </div>
        `;
      }).join("")}</div>`;
    }

    function renderPrediction(tokens) {
      const prediction = sentimentPrediction(tokens);
      const pos = Math.round(prediction.positive * 100);
      const neg = Math.round(prediction.negative * 100);
      const label = pos >= neg ? "Positive" : "Negative";
      return `
        <div class="prediction-wrap">
          <div class="bar-row">
            <strong>Positive</strong>
            <div class="bar-track"><div class="bar-fill positive" style="width:${pos}%"></div></div>
            <span>${pos}%</span>
          </div>
          <div class="bar-row">
            <strong>Negative</strong>
            <div class="bar-track"><div class="bar-fill negative" style="width:${neg}%"></div></div>
            <span>${neg}%</span>
          </div>
          <div class="callout">Final class: <strong>${label}</strong>. In this toy model, negation near a sentiment word can flip the sentiment signal.</div>
        </div>
      `;
    }

    function setPanelTitles(leftTitle, leftMeta, rightTitle, rightMeta) {
      document.getElementById("leftTitle").textContent = leftTitle;
      document.getElementById("leftMeta").textContent = leftMeta;
      document.getElementById("rightTitle").textContent = rightTitle;
      document.getElementById("rightMeta").textContent = rightMeta;
      document.getElementById("currentStepLabel").textContent = steps.find(step => step.id === activeStep).label;
    }

    function renderNotes(step, tokens) {
      const noteMap = {
        tokens: `
          <div class="callout">Tokenization converts raw text into smaller pieces. A transformer never receives a sentence directly; it receives token IDs.</div>
          <div class="formula">Raw text -> tokens -> token IDs</div>
        `,
        vectors: `
          <div class="callout">Embedding stores meaning. Position stores order. The model adds them before attention begins.</div>
          <div class="formula">input_vector = token_embedding + positional_encoding</div>
        `,
        attention: `
          <div class="callout">Each row is a Query token. Each column is a Key token. Higher values mean the Query is listening more strongly to that Key.</div>
          <div class="formula">Attention(Q,K,V) = softmax(QK^T / sqrt(d_k))V</div>
        `,
        heads: `
          <div class="callout">Multi-head attention runs several attention patterns in parallel, then combines them into one richer representation.</div>
          <div class="formula">head_1 + head_2 + head_3 -> combined context</div>
        `,
        prediction: `
          <div class="callout">After attention and feed forward processing, an output head converts the final representation into class probabilities.</div>
          <div class="formula">context vectors -> classifier -> softmax probabilities</div>
        `
      };
      return noteMap[step];
    }

    function render() {
      const sentence = document.getElementById("sentenceInput").value;
      const tokens = tokenize(sentence);
      const left = document.getElementById("leftPanel");
      const right = document.getElementById("rightPanel");

      renderButtons();
      renderFlow();

      if (activeStep === "tokens") {
        setPanelTitles("Tokens", "text to pieces", "Class Notes", "tokenization");
        left.innerHTML = renderTokenChips(tokens);
        right.innerHTML = renderNotes(activeStep, tokens);
      }

      if (activeStep === "vectors") {
        setPanelTitles("Embedding + Position", "numbers with order", "Class Notes", "input vectors");
        left.innerHTML = renderVectorTable(tokens);
        right.innerHTML = renderNotes(activeStep, tokens);
      }

      if (activeStep === "attention") {
        setPanelTitles("Self-Attention Matrix", "average of toy heads", "Class Notes", "Q K V");
        left.innerHTML = renderAttentionTable(tokens, averageAttention(tokens));
        right.innerHTML = renderNotes(activeStep, tokens);
      }

      if (activeStep === "heads") {
        setPanelTitles("Multi-Head Attention", "parallel views", "Class Notes", "head behavior");
        left.innerHTML = renderHeads(tokens);
        right.innerHTML = renderNotes(activeStep, tokens);
      }

      if (activeStep === "prediction") {
        setPanelTitles("Output Prediction", "toy classifier", "Class Notes", "final layer");
        left.innerHTML = renderPrediction(tokens);
        right.innerHTML = renderNotes(activeStep, tokens);
      }
    }

    document.getElementById("sentenceInput").addEventListener("input", render);
    render();
  </script>
</body>
</html>
